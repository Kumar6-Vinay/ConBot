<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConBOT - Ask. Learn. Understand.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h1>ConBOT</h1>
                <p>Ask. Learn. Understand.</p>
            </div>
            <button class="new-chat-btn">+ New Chat</button>
            <div class="chat-history">
                <p>No chat history yet</p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <h2>Ask.Learn.Understand.</h2>
                        <p>Your questions. Made clear.</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="userInput" 
                            class="user-input" 
                            placeholder="What are you curious about?"
                            autocomplete="off"
                        >
                        <button class="send-btn" onclick="sendMessage()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="1"></circle>
                                <path d="M12 19V5M19 12H5"></path>
                                <path d="M17.66 7.34l-9.32 9.32M6.34 7.34l9.32 9.32"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
