<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="CONBOT — Ask anything.">

    <title>CONBOT — Ask anything</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Navigation -->
    <header class="site-header">

        <a href="/" class="brand">
            CONBOT
        </a>

        <nav class="top-nav">

            <button class="nav-link" id="imagineButton" type="button">
                <span>✦</span>
                Imagine
            </button>

            <button
                class="icon-button"
                id="settingsButton"
                type="button"
                aria-label="Settings"
            >
                ⚙
            </button>

            <button
                class="auth-button secondary"
                type="button"
            >
                Sign in
            </button>

            <button
                class="auth-button primary"
                type="button"
            >
                Sign up
            </button>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="landing">

        <section class="hero">

            <h1>
                What should we explore?
            </h1>


            <!-- Chat Composer -->
            <form id="chatForm" class="composer">

                <!-- Chat Messages -->
                <div
                    id="chatMessages"
                    class="chat-messages"
                    aria-live="polite"
                ></div>


                <!-- Prompt Input -->
                <textarea
                    id="promptInput"
                    rows="1"
                    placeholder="Type / to use slash commands"
                    autocomplete="off"
                    aria-label="Message CONBOT"
                ></textarea>


                <!-- Composer Toolbar -->
                <div class="composer-toolbar">

                    <button
                        type="button"
                        class="tool-button"
                        id="attachButton"
                        aria-label="Add attachment"
                    >
                        +
                    </button>


                    <div class="composer-actions">

                        <button
                            type="button"
                            class="model-button"
                            id="modelButton"
                        >
                            Fast
                            <span>⌄</span>
                        </button>

                        <button
                            type="submit"
                            class="send-button"
                            aria-label="Send message"
                        >
                            ↑
                        </button>

                    </div>

                </div>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <p>
            By messaging CONBOT, you agree to our
            <a href="#">Terms</a>
            and
            <a href="#">Privacy Policy</a>.
        </p>

        <a href="#">
            Your privacy choices
        </a>

    </footer>


    <!-- Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Application JavaScript -->
    <script src="app.js"></script>

</body>
</html>
