<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="ConBOT — ask a question, get a clear answer.">
<title>ConBOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sidebar: New chat, pinned, and history. Off-canvas on mobile. -->
<aside class="sidebar" id="sidebar" aria-label="Conversations">
  <div class="side-head">
    <button class="wordmark side-mark" id="sideMark" type="button" title="ConBOT">
      ConBOT<span class="dot"></span>
    </button>
    <button class="ghost side-close" id="sideClose" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <button class="side-new" id="sideNew" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>

  <nav class="side-list" id="sideList" aria-label="Saved chats"></nav>

  <div class="side-foot">
    <button class="side-foot-btn" id="sideTheme" type="button" aria-label="Switch appearance">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="ic-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m11.32 0 1.41 1.41M4.93 4.93l1.41 1.41M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
        <path class="ic-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
      <span id="sideThemeLabel">Dark mode</span>
    </button>
  </div>
</aside>

<div class="side-scrim" id="sideScrim" hidden></div>

<header class="bar" id="bar">
  <div class="bar-inner">
    <button class="ghost menu-btn" id="menuBtn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="wordmark" id="newChat" type="button" title="Start a new chat">
      ConBOT<span class="dot"></span>
    </button>
    <button class="ghost" id="themeToggle" type="button" aria-label="Switch appearance">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="ic-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m11.32 0 1.41 1.41M4.93 4.93l1.41 1.41M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
        <path class="ic-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>

<main class="stage" id="stage">

  <!-- Opening state: headline, composer and chips read as one group -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <!-- "Ask" is fixed; only the trailing phrase rotates, left-anchored.
           aria-live announces each phrase; the visible span is swapped by JS. -->
      <h1 class="headline">Ask&nbsp;<span class="rotator" id="rotator" aria-live="polite">anything.</span></h1>

      <div class="composer" id="heroComposer">
        <label class="sr" for="input">Your question</label>
        <button class="mic" id="mic" type="button" aria-label="Speak your question" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask ConBOT" autocomplete="off" maxlength="3000"></textarea>
        <button class="send" id="send" type="button" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>

      <div class="chips" id="chips">
        <button type="button" class="chip">Explain GST in simple terms</button>
        <button type="button" class="chip">What's the weather today</button>
        <button type="button" class="chip">Write a polite refund email</button>
        <button type="button" class="chip">Mujhe PAN card ke baare mein batao</button>
      </div>
    </div>
  </section>

  <section class="thread" id="thread" aria-live="polite" aria-label="Conversation"></section>

</main>

<!-- Composer docks here once the conversation starts -->
<div class="dock" id="dock" hidden>
  <div class="dock-inner" id="dockSlot"></div>
  <p class="fineprint">ConBOT can make mistakes. Check anything important.</p>
</div>

<script src="app.js"></script>
</body>
</html>
