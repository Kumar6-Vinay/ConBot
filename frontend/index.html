<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="ConBOT — ask a question, get a clear answer.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C31262C8RB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C31262C8RB');
</script>

<title>ConBOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sidebar: New chat, pinned, and history. Fixed on desktop (home and
     chat both), off-canvas behind a scrim on mobile. -->
<aside class="sidebar" id="sidebar" aria-label="Conversations">
  <div class="side-head">
    <button class="wordmark side-mark" id="sideMark" type="button" title="ConBOT" aria-label="Go to home">
      <svg class="mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="9" cy="12" r="6.5" stroke-dasharray="27 14.8" transform="rotate(20 9 12)"/>
        <circle cx="15" cy="12" r="6.5" stroke-dasharray="27 14.8" transform="rotate(200 15 12)"/>
      </svg>
      <span>Con<span class="lb">BOT</span></span>
    </button>
    <button class="ghost side-close" id="sideClose" type="button" aria-label="Hide sidebar">
      <svg class="ic-x" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <svg class="ic-collapse" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
  </div>

  <button class="side-new" id="sideNew" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>

  <button class="side-imagegen" id="sideImageGen" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 16l4.5-6 3.5 4.5 2.5-3L20 16"/>
      <rect x="3" y="4" width="18" height="16" rx="3"/>
      <circle cx="8.2" cy="8.2" r="1.4"/>
    </svg>
    Generate image
  </button>

  <div class="side-recent" id="sideRecent" hidden>
    <p class="side-section">Recent</p>
    <nav class="side-list" id="sideList" aria-label="Saved chats"></nav>
  </div>
</aside>

<div class="side-scrim" id="sideScrim" hidden></div>

<header class="bar" id="bar">
  <div class="bar-inner">
    <button class="ghost menu-btn" id="menuBtn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="wordmark" id="newChat" type="button" title="Start a new chat" aria-label="Go to home">
      <svg class="mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="9" cy="12" r="6.5" stroke-dasharray="27 14.8" transform="rotate(20 9 12)"/>
        <circle cx="15" cy="12" r="6.5" stroke-dasharray="27 14.8" transform="rotate(200 15 12)"/>
      </svg>
      <span>Con<span class="lb">BOT</span></span>
    </button>
    <button class="ghost theme-toggle" type="button" aria-label="Switch appearance">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="ic-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m11.32 0 1.41 1.41M4.93 4.93l1.41 1.41M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
        <path class="ic-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>

<main class="stage" id="stage">

  <!-- Opening state: heading, composer and chips read as one centred group.
       Swaps for .thread once the first message sends (see startThread()). -->
  <section class="hero" id="hero">
    <div class="hero-inner" id="top">
      <h1 class="ask-heading">What do you want to know?</h1>

      <div class="composer" id="heroComposer">
        <label class="sr" for="input">Your question</label>
        <textarea id="input" rows="1" placeholder="Type your question here…" autocomplete="off" maxlength="3000"></textarea>
        <button class="mic" id="mic" type="button" aria-label="Speak your question">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </button>
        <button class="send" id="send" type="button" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
        <div class="tools">
          <div class="plus-wrap">
            <button class="plus" id="plusBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Add to your question">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="plus-menu" id="plusMenu" role="menu" aria-label="Add to your question" hidden>
              <div class="sheet-handle" aria-hidden="true"></div>
              <p class="sheet-title">Add to your question</p>
              <button class="plus-item" id="takePhotoBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2l1.5-2h5L16 4h2a2 2 0 0 1 2 2v2"/><rect x="2" y="8" width="20" height="13" rx="2"/><circle cx="12" cy="14.5" r="3.5"/></svg>
                <span><b>Take photo</b><small>Use your camera</small></span>
              </button>
              <button class="plus-item" id="uploadPhotoBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
                <span><b>Upload photo</b><small>PNG, JPEG, WebP or GIF</small></span>
              </button>
              <button class="plus-item" id="genImageBtn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.2" cy="8.2" r="1.4"/><path d="M4 16l4.5-6 3.5 4.5 2.5-3L20 16"/></svg>
                <span><b>Generate image</b><small>Create a picture from words</small></span>
              </button>
              <button class="sheet-cancel" id="sheetCancel" type="button">Cancel</button>
            </div>
          </div>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
          <span class="count" id="count" aria-live="off">0/3000</span>
        </div>
      </div>

      <div class="chips" id="chips">
        <button type="button" class="chip" data-fill="Best AC under ₹40,000">Best AC under ₹40,000</button>
        <button type="button" class="chip" data-fill="Home remedy for a sore throat">Home remedy for a sore throat</button>
        <button type="button" class="chip" data-fill="Quick dal tadka for two">Quick dal tadka for two</button>
        <button type="button" class="chip" data-fill="Explain UPI in simple words">Explain UPI in simple words</button>
      </div>

      <p class="fineprint hero-fineprint" id="heroFine">ConBOT can make mistakes. Check anything important.</p>
    </div>
  </section>

  <section class="thread" id="thread" aria-live="polite" aria-label="Conversation"></section>

  <section class="imggen" id="imggenView" aria-label="Generate image" hidden>
    <div class="imggen-inner">
      <div class="imggen-bar">
        <button class="ghost imggen-back" id="imggenBack" type="button" aria-label="Back to chat">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <span class="imggen-title">Generate image</span>
      </div>

      <div class="imggen-body">
        <div class="imggen-controls">
          <label class="sr" for="imgPrompt">Describe the image</label>
          <div class="imggen-prompt-wrap">
            <textarea id="imgPrompt" rows="4" maxlength="1000"
              placeholder="A quiet mountain lake at sunrise, soft mist, warm light"></textarea>
            <button class="imgmic" id="imgMic" type="button" aria-label="Speak your description" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
              </svg>
            </button>
          </div>

          <label class="sr" for="imgModel">Model</label>
          <select id="imgModel">
            <option value="lykon/dreamshaper-8-lcm">DreamShaper 8 — fast &amp; free</option>
            <option value="black-forest-labs/flux.1-schnell">FLUX.1 Schnell — best quality</option>
            <option value="tongyi-mai/z-image-turbo">Z-Image Turbo — fastest</option>
          </select>

          <button class="imggen-generate" id="imgGenerate" type="button">Generate</button>

          <div class="imggen-history" id="imggenHistory" hidden>
            <p class="imggen-history-label">This session</p>
            <div class="imggen-history-row" id="imggenHistoryRow"></div>
          </div>
        </div>

        <div class="imggen-canvas">
          <div class="imggen-frame" id="imggenFrame">
            <div class="imggen-placeholder" id="imggenPlaceholder">
              <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"/>
                <circle cx="8.2" cy="8.2" r="1.4"/>
                <path d="M4 16l4.5-6 3.5 4.5 2.5-3L20 16"/>
              </svg>
            </div>
          </div>
          <p class="imggen-error" id="imgResult" hidden></p>
          <div class="imggen-actions" id="imggenActions" hidden>
            <button class="imggen-action" id="imggenRegenerate" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14-4.5M4 14a8 8 0 0 0 14 4.5"/></svg>
              Regenerate
            </button>
            <a class="imggen-action" id="imggenDownload" download="conbot-image.png" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v13m0 0-4-4m4 4 4-4"/><path d="M5 19h14"/></svg>
              Download
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Composer docks here once the conversation starts -->
<div class="dock" id="dock" hidden>
  <div class="dock-inner" id="dockSlot"></div>
  <p class="fineprint">ConBOT can make mistakes. Check anything important.</p>
</div>

<!-- Backdrop behind the "+" menu on mobile, where it's a bottom sheet -->
<div class="sheet-scrim" id="sheetScrim" hidden></div>

<!-- Desktop "Take photo": live camera via getUserMedia -->
<div class="cam-modal" id="camModal" role="dialog" aria-modal="true" aria-label="Take a photo" hidden>
  <div class="cam-inner">
    <button class="ghost cam-close" id="camClose" type="button" aria-label="Close camera">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <video class="cam-video" id="camVideo" autoplay playsinline muted></video>
    <p class="cam-error" id="camError" hidden></p>
    <div class="cam-controls">
      <button class="cam-choose" id="camChoose" type="button">Choose a photo instead</button>
      <button class="cam-capture" id="camCapture" type="button" aria-label="Capture photo"></button>
      <span class="cam-spacer" aria-hidden="true"></span>
    </div>
  </div>
</div>
<canvas id="camCanvas" hidden></canvas>

<script src="app.js"></script>
</body>
</html>
